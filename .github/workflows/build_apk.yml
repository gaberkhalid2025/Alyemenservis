name: Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Ensure Gradle Wrapper 9.3.1
      run: |
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew

    - name: Create google-services.json
      run: |
        mkdir -p app
        cat << 'EOF' > app/google-services.json
        {
          "project_info": {
            "project_number": "896795585945",
            "project_id": "al-yemen-services",
            "storage_bucket": "al-yemen-services.firebasestorage.app"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:896795585945:android:fa9e452a045b811dca7708",
                "android_client_info": {
                  "package_name": "com.alyemenservices"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyBfVDnH4FfA_lR6HQFwOWSSBRcN__InczE"
                }
              ],
              "services": {
                "appinvite_service": {
                  "other_platform_oauth_client": []
                }
              }
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Build Release APK
      run: ./gradlew :app:assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: app/build/outputs/apk/release/*.apk
