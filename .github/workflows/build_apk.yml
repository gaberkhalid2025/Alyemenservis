name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Create google-services.json & .env
        run: |
          mkdir -p app
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "896795585945",
              "project_id": "al-yemen-services",
              "storage_bucket": "al-yemen-services.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:896795585945:android:fa9e452a045b811dca7708",
                  "android_client_info": {
                    "package_name": "com.alyemenservices"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyBfVDnH4FfA_lR6HQFwOWSSBRcN__InczE"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          touch .env
          touch .env.example

      - name: Setup Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding user release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ] && [ ! -f my-release-key.jks ]; then
            echo "Generating fallback keystore..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK with Gradle
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace || ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Find and Prepare APK Output
        run: |
          mkdir -p final_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} final_apk/ \;
          ls -la final_apk/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yemen-services-release-apk
          path: final_apk/*.apk
          retention-days: 14
