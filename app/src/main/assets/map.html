<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>خريطة Vela العالمية المفتوحة</title>
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="MarkerCluster.css" />
    <link rel="stylesheet" href="MarkerCluster.Default.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0B1120;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Tahoma, sans-serif;
            overflow: hidden;
        }
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #0B1120;
            transition: transform 0.3s ease;
        }

        /* Marker Badge Design */
        .custom-leaflet-marker {
            background: transparent !important;
            border: none !important;
            overflow: visible !important;
        }
        .custom-pin-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
            user-select: none;
            -webkit-user-select: none;
            width: 145px;
        }
        .custom-pin-head {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: #ffffff;
            border: 2.5px solid #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-pin-head:hover,
        .custom-pin-head:active {
            transform: scale(1.18);
        }
        .custom-pin-label {
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 2.5px 8px;
            border-radius: 12px;
            margin-top: 3px;
            white-space: nowrap;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            border: 1px solid rgba(0, 229, 255, 0.55);
            text-align: center;
            pointer-events: none;
        }

        /* User GPS Location Marker */
        .user-pulse-marker {
            position: relative;
            width: 24px;
            height: 24px;
        }
        .user-dot {
            width: 16px;
            height: 16px;
            background: #00E5FF;
            border: 3px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
            box-shadow: 0 0 14px #00E5FF;
            z-index: 2;
        }
        .user-pulse {
            width: 40px;
            height: 40px;
            background: rgba(0, 229, 255, 0.35);
            border-radius: 50%;
            position: absolute;
            top: -8px;
            left: -8px;
            animation: userPulsing 2s infinite ease-out;
            z-index: 1;
        }
        @keyframes userPulsing {
            0% { transform: scale(0.4); opacity: 0.95; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        .mode-indicator {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00E5FF;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .leaflet-control-zoom {
            display: none !important;
        }
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.65) !important;
            color: #64748B !important;
            font-size: 7.5px !important;
            padding: 1px 6px !important;
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.85) !important;
            color: #CBD5E1 !important;
            font-size: 10px !important;
            line-height: 14px !important;
            padding: 2px 8px !important;
            border-radius: 8px 0 0 0;
            max-width: 85vw;
        }
        .leaflet-control-attribution a {
            color: #7DD3FC !important;
            text-decoration: underline !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        <div id="modeIndicator" class="mode-indicator">
            <span id="modeIcon">🛰️</span>
            <span id="modeTitle">أقمار صناعية</span>
        </div>
    </div>

    <script src="leaflet.js"></script>
    <script src="leaflet.markercluster.js"></script>
    <script>
        var map;
        var currentBaseLayer;
        var currentProviderKey = 'satellite';
        var nightEnabled = false;
        var markerClusterGroup;
        var userMarker = null;
        var userAccuracyCircle = null;
        var userLat = 15.3694;
        var userLng = 44.1910;
        var activeMode = 'SATELLITE';

        function ensurePane(name, zIndex) {
            if (!map) return null;
            var pane = map.getPane(name);
            if (!pane) {
                pane = map.createPane(name);
                pane.style.zIndex = zIndex;
                pane.style.pointerEvents = 'none';
            }
            return pane;
        }

        function applyNight() {
            if (!currentBaseLayer) return;
            try {
                var el = currentBaseLayer.getContainer();
                if (!el) return;
                if (!nightEnabled) {
                    el.style.filter = '';
                    el.style.webkitFilter = '';
                    return;
                }
                if (currentProviderKey === 'satellite') {
                    var satFilter = 'brightness(0.80) contrast(1.05)';
                    el.style.filter = satFilter;
                    el.style.webkitFilter = satFilter;
                } else {
                    var vectorFilter = 'invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.95) saturate(0.85)';
                    el.style.filter = vectorFilter;
                    el.style.webkitFilter = vectorFilter;
                }
            } catch (e) {
                console.error('applyNight error', e);
            }
        }

        function setNightMode(on) {
            nightEnabled = !!on;
            applyNight();
        }
        window.setNightMode = setNightMode;

        var ATTR_OSM = '© <a href="https://www.openstreetmap.org/copyright">مساهمو OpenStreetMap</a>';
        var providers = {
            'osm': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 24, maxNativeZoom: 19, attribution: ATTR_OSM
            }),
            'hot': L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
                maxZoom: 24, maxNativeZoom: 19, subdomains: ['a', 'b', 'c'],
                attribution: ATTR_OSM + ' — نمط <a href="https://www.hotosm.org/">HOT</a>'
            }),
            'topo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                maxZoom: 24, maxNativeZoom: 17, subdomains: ['a', 'b', 'c'],
                attribution: ATTR_OSM + ' — SRTM | نمط © <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
            }),
            'satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 24, maxNativeZoom: 19,
                attribution: 'صور © <a href="https://www.esri.com">Esri</a> — Maxar, Earthstar Geographics'
            })
        };

        var tileOk = 0, tileErr = 0, tilesFailingNotified = false;
        function notifyTiles(failing) {
            if (window.AndroidBridge && window.AndroidBridge.onTilesFailing) window.AndroidBridge.onTilesFailing(failing);
        }
        function watchLayer(layer) {
            tileOk = 0; tileErr = 0; tilesFailingNotified = false;
            if (!layer) return;
            layer.off('tileload'); layer.off('tileerror');
            layer.on('tileload', function () {
                tileOk++;
                if (tilesFailingNotified && tileOk >= 4) { tilesFailingNotified = false; notifyTiles(false); }
            });
            layer.on('tileerror', function () {
                tileErr++;
                if (!tilesFailingNotified && tileErr >= 6 && tileOk < tileErr / 4) { tilesFailingNotified = true; notifyTiles(true); }
            });
        }

        var pickModeEnabled = false;
        function setPickMode(on) {
            pickModeEnabled = !!on;
            try { if (map) map.getContainer().style.cursor = pickModeEnabled ? 'crosshair' : ''; } catch (e) {}
        }
        window.setPickMode = setPickMode;

        var labelsOverlay = null;
        function setHybridLabels(on) {
            if (!map) return;
            if (on) {
                if (!labelsOverlay) {
                    ensurePane('labelsPane', 250);
                    labelsOverlay = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
                        maxZoom: 24, maxNativeZoom: 19,
                        pane: 'labelsPane',
                        attribution: 'أسماء © <a href="https://www.esri.com">Esri</a>'
                    });
                }
                if (!map.hasLayer(labelsOverlay)) labelsOverlay.addTo(map);
            } else if (labelsOverlay && map.hasLayer(labelsOverlay)) {
                map.removeLayer(labelsOverlay);
            }
        }
        window.setHybridLabels = setHybridLabels;

        var GIBS_PRODUCTS = {
            'truecolor': {
                layer: 'MODIS_Terra_CorrectedReflectance_TrueColor',
                format: 'jpg',
                maxZoom: 9
            },
            'landtemp': {
                layer: 'MODIS_Terra_Land_Surface_Temp_Day',
                format: 'png',
                maxZoom: 7
            }
        };

        function gibsDate(daysAgo) {
            var d = new Date();
            d.setUTCDate(d.getUTCDate() - (daysAgo || 1));
            var y = d.getUTCFullYear();
            var m = String(d.getUTCMonth() + 1).padStart(2, '0');
            var day = String(d.getUTCDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }

        function gibsUrl(prodKey, daysAgo) {
            var p = GIBS_PRODUCTS[prodKey] || GIBS_PRODUCTS['truecolor'];
            var dateStr = gibsDate(daysAgo);
            return 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/' +
                p.layer + '/default/' + dateStr +
                '/GoogleMapsCompatible_Level9/{z}/{y}/{x}.' + p.format;
        }

        var gibsOverlay = null;
        var gibsRetryCount = 0;
        function notifyGibs(ok) {
            if (window.AndroidBridge && window.AndroidBridge.onGibsStatus) {
                window.AndroidBridge.onGibsStatus(!!ok);
            }
        }

        function setGibs(on, prodKey) {
            if (!map) return;
            prodKey = prodKey || 'truecolor';
            if (gibsOverlay && map.hasLayer(gibsOverlay)) {
                map.removeLayer(gibsOverlay);
                gibsOverlay = null;
            }
            if (!on) {
                notifyGibs(false);
                return;
            }

            ensurePane('gibsPane', 260);
            var prod = GIBS_PRODUCTS[prodKey] || GIBS_PRODUCTS['truecolor'];
            gibsRetryCount = 0;

            function tryLoadWithOffset(offset) {
                if (offset > 3) {
                    notifyGibs(false);
                    return;
                }
                var url = gibsUrl(prodKey, offset);
                var layer = L.tileLayer(url, {
                    maxZoom: prod.maxZoom,
                    maxNativeZoom: prod.maxZoom,
                    opacity: 0.75,
                    pane: 'gibsPane',
                    attribution: 'بيانات الأقمار © <a href="https://earthdata.nasa.gov/gibs">NASA EOSDIS GIBS</a>'
                });

                var okCount = 0, errCount = 0;
                layer.on('tileload', function() {
                    okCount++;
                    if (okCount === 1) notifyGibs(true);
                });
                layer.on('tileerror', function() {
                    errCount++;
                    if (okCount === 0 && errCount >= 4) {
                        try { map.removeLayer(layer); } catch (e) {}
                        tryLoadWithOffset(offset + 1);
                    }
                });

                gibsOverlay = layer;
                gibsOverlay.addTo(map);
            }

            tryLoadWithOffset(1);
        }
        window.setGibs = setGibs;

        function initMap(lat, lng, mode) {
            userLat = lat || 15.3694;
            userLng = lng || 44.1910;
            activeMode = mode || 'SATELLITE';

            try {
                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: true,
                    fadeAnimation: true,
                    zoomAnimation: true
                }).setView([userLat, userLng], 15);

                setLayer(activeMode);

                markerClusterGroup = L.markerClusterGroup({
                    maxClusterRadius: 40,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false
                });
                map.addLayer(markerClusterGroup);

                map.on('dragstart', function () {
                    if (window.AndroidBridge && window.AndroidBridge.onUserPanned) window.AndroidBridge.onUserPanned();
                });
                map.on('click', function (e) {
                    if (pickModeEnabled) {
                        if (window.AndroidBridge && window.AndroidBridge.onMapPicked) {
                            window.AndroidBridge.onMapPicked(e.latlng.lat, e.latlng.lng);
                        }
                        return;
                    }
                    if (window.AndroidBridge && window.AndroidBridge.onMapClicked) window.AndroidBridge.onMapClicked();
                });

                updateUserLocation(userLat, userLng, 50, false);

                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            } catch (e) {
                console.error("Map init error:", e);
            }
        }

        function setLayer(mode) {
            activeMode = mode || 'SATELLITE';
            if (currentBaseLayer && map) {
                map.removeLayer(currentBaseLayer);
            }

            var providerKey = 'satellite';
            var title = 'أقمار صناعية';
            var icon = '🛰️';

            if (mode === 'OSM') {
                providerKey = 'osm';
                title = 'خريطة الشوارع القياسية (OSM)';
                icon = '🌐';
            } else if (mode === 'HOT') {
                providerKey = 'hot';
                title = 'خريطة الشوارع الحية (HOT)';
                icon = '🗺️';
            } else if (mode === 'TOPO') {
                providerKey = 'topo';
                title = 'التضاريس والارتفاعات (Topo)';
                icon = '⛰️';
            } else if (mode === 'VELA_3D') {
                providerKey = 'satellite';
                title = 'أقمار صناعية';
                icon = '🛰️';
            } else if (mode === 'SATELLITE') {
                providerKey = 'satellite';
                title = 'أقمار صناعية';
                icon = '🛰️';
            }

            if (providers[providerKey] && map) {
                currentBaseLayer = providers[providerKey];
                currentBaseLayer.addTo(map);
                watchLayer(currentBaseLayer);
                currentProviderKey = providerKey;
                applyNight();
            }

            var iconEl = document.getElementById('modeIcon');
            var titleEl = document.getElementById('modeTitle');
            if (iconEl) iconEl.innerText = icon;
            if (titleEl) titleEl.innerText = title;
        }

        function switchMapMode(mode) {
            setLayer(mode);
        }

        function reloadBaseLayer() {
            if (currentBaseLayer && map) {
                map.removeLayer(currentBaseLayer);
                currentBaseLayer.addTo(map);
                watchLayer(currentBaseLayer);
                notifyTiles(false);
            }
        }
        window.reloadBaseLayer = reloadBaseLayer;

        function updateUserLocation(lat, lng, accuracy, pan) {
            userLat = lat;
            userLng = lng;
            if (!map) return;
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
                if (userAccuracyCircle) {
                    userAccuracyCircle.setLatLng([lat, lng]);
                    userAccuracyCircle.setRadius(accuracy || 50);
                }
                if (pan) map.setView([lat, lng], map.getZoom());
            } else {
                var pulseHtml = '<div class="user-pulse-marker"><div class="user-pulse"></div><div class="user-dot"></div></div>';
                var icon = L.divIcon({
                    className: 'custom-leaflet-marker',
                    html: pulseHtml,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                userMarker = L.marker([lat, lng], {icon: icon}).addTo(map);
                userAccuracyCircle = L.circle([lat, lng], {
                    radius: accuracy || 50,
                    color: '#00E5FF',
                    fillColor: '#00E5FF',
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(map);
                if (pan) map.setView([lat, lng], 15);
            }
        }

        function setMarkersBase64(b64) {
            try {
                var jsonStr = decodeURIComponent(escape(window.atob(b64)));
                var markers = JSON.parse(jsonStr);
                setMarkersList(markers);
            } catch (e) {
                console.error("setMarkersBase64 error:", e);
            }
        }

        function setMarkers(jsonStr) {
            try {
                var markers = JSON.parse(jsonStr);
                setMarkersList(markers);
            } catch (e) {
                console.error("setMarkers error:", e);
            }
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function setMarkersList(markers) {
            if (!markerClusterGroup) return;
            markerClusterGroup.clearLayers();
            markers.forEach(function (m) {
                if (typeof m.lat !== 'number' || typeof m.lng !== 'number' || (m.lat === 0 && m.lng === 0)) return;
                var type = String(m.type || m.category || '').toUpperCase();
                var color = /^#[0-9A-Fa-f]{3,8}$/.test(m.badgeColor || '') ? m.badgeColor : (type === 'STORE' ? '#10B981' : (type === 'PROVIDER' ? '#3B82F6' : '#F59E0B'));
                var emoji = m.emoji || (type === 'STORE' ? '🏪' : (type === 'PROVIDER' ? '👷' : '📍'));
                var name = m.name || m.title || '';
                var approx = m.isApprox === true;
                var html = '<div class="custom-pin-container">' +
                    '<div class="custom-pin-head" style="background-color:' + color + ';' +
                    (approx ? 'opacity:0.65;border:2px dashed #fff;' : '') + '">' + esc(emoji) + '</div>' +
                    '<div class="custom-pin-label">' + esc(name) + (approx ? ' (موقع تقريبي)' : '') + '</div></div>';
                var icon = L.divIcon({ className: 'custom-leaflet-marker', html: html, iconSize: [145, 65], iconAnchor: [72, 38] });
                var marker = L.marker([m.lat, m.lng], { icon: icon });
                marker.on('click', function () { onMarkerClick(String(m.id), type); });
                markerClusterGroup.addLayer(marker);
            });
        }

        function onMarkerClick(id, type) {
            if (window.AndroidBridge && window.AndroidBridge.onMarkerClicked) {
                window.AndroidBridge.onMarkerClicked(id, type);
            } else if (window.AndroidBridge && window.AndroidBridge.onMarkerSelected) {
                window.AndroidBridge.onMarkerSelected(id, type);
            }
        }

        function setCity(name, lat, lng, zoom) {
            if (map) {
                map.setView([lat, lng], zoom || 14);
            }
        }

        function setMapPerspective(tilt, rotation) {
            // No CSS tilt skewing to prevent distortion
        }

        function zoomIn() {
            if (map) map.zoomIn();
        }

        function zoomOut() {
            if (map) map.zoomOut();
        }

        function recenterUser() {
            if (map && userLat && userLng) {
                map.setView([userLat, userLng], 15);
            }
        }

        // [إصلاح ملاحة نهائي] إدارة المسار، المحطات، ودبوس البحث
        var routeLayer = null;
        var routeCasing = null;
        var waypointLayer = null;
        var searchPin = null;

        function clearRoute() {
            if (map && routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
            if (map && routeCasing) { map.removeLayer(routeCasing); routeCasing = null; }
        }

        function setRouteBase64(b64, fit) {
            try {
                var jsonStr = (b64.indexOf('[') === 0) ? b64 : decodeURIComponent(escape(window.atob(b64)));
                var pts = JSON.parse(jsonStr); // [[lat,lng],...]
                clearRoute();
                if (!map || !pts || pts.length < 2) return;
                routeCasing = L.polyline(pts, { color: '#0B1120', weight: 10, opacity: 0.9, lineCap: 'round', lineJoin: 'round' }).addTo(map);
                routeLayer = L.polyline(pts, { color: '#00E5FF', weight: 5, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(map);
                if (fit !== false) {
                    map.fitBounds(routeLayer.getBounds(), { padding: [60, 60], maxZoom: 17 });
                }
            } catch (e) {
                console.error('setRouteBase64 error', e);
            }
        }

        function setRoute(coordsJson) {
            setRouteBase64(coordsJson, true);
        }

        function setWaypointMarkersBase64(b64) {
            try {
                var jsonStr = decodeURIComponent(escape(window.atob(b64)));
                var list = JSON.parse(jsonStr); // [{label,lat,lng}]
                if (!map) return;
                if (waypointLayer) { map.removeLayer(waypointLayer); }
                waypointLayer = L.layerGroup();
                list.forEach(function (w, i) {
                    var html = '<div style="background:#10B981;color:#fff;border:2px solid #fff;border-radius:50%;width:26px;height:26px;' +
                        'display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,0.5);">' + (i + 1) + '</div>';
                    var icon = L.divIcon({ className: 'wp-marker', html: html, iconSize: [26, 26], iconAnchor: [13, 13] });
                    L.marker([w.lat, w.lng], { icon: icon, interactive: false }).addTo(waypointLayer);
                });
                waypointLayer.addTo(map);
            } catch (e) {
                console.error('setWaypointMarkers error', e);
            }
        }

        function showSearchPinBase64(b64) {
            try {
                var jsonStr = decodeURIComponent(escape(window.atob(b64)));
                var p = JSON.parse(jsonStr); // {name,lat,lng}
                if (!map) return;
                if (searchPin) { map.removeLayer(searchPin); searchPin = null; }
                var html = '<div class="custom-pin-container"><div class="custom-pin-head" style="background-color:#F59E0B;">📍</div>' +
                    '<div class="custom-pin-label">' + esc(p.name) + '</div></div>';
                var icon = L.divIcon({ className: 'custom-leaflet-marker', html: html, iconSize: [145, 65], iconAnchor: [72, 38] });
                searchPin = L.marker([p.lat, p.lng], { icon: icon }).addTo(map);
                map.flyTo([p.lat, p.lng], 17, { duration: 1.2, easeLinearity: 0.25 });
            } catch (e) {
                console.error('showSearchPin error', e);
            }
        }

        function clearSearchPin() {
            if (map && searchPin) { map.removeLayer(searchPin); searchPin = null; }
        }

        function setNavZoom(z) {
            if (!map || typeof z !== 'number') return;
            var target = Math.max(3, Math.min(20, Math.round(z)));
            if (map.getZoom() !== target) map.setZoom(target, { animate: true });
        }
        window.setNavZoom = setNavZoom;

        // Auto initialize on load if not called by Android view
        window.onload = function() {
            if (!map) {
                initMap(15.3694, 44.1910, 'SATELLITE');
            }
        };
    </script>
</body>
</html>
