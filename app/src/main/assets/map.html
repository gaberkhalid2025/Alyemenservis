<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>خريطة دليل اليمن التفاعلية المباشرة</title>
    
    <!-- Local Leaflet and MarkerCluster CSS -->
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="MarkerCluster.css" />
    <link rel="stylesheet" href="MarkerCluster.Default.css" />
    
    <!-- Local Leaflet and MarkerCluster JS -->
    <script src="leaflet.js"></script>
    <script src="leaflet.markercluster.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            background: #E8ECE9; /* لون خريطة طبيعي مريح بدلاً من الشاشة السوداء */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #E8ECE9;
        }
        
        .leaflet-container { 
            width: 100%; 
            height: 100%; 
            background: #E8ECE9 !important; 
            font-family: inherit; 
        }
        .leaflet-pane { z-index: 400; }
        .leaflet-tile-pane { z-index: 200; }
        .leaflet-marker-pane { z-index: 600; }
        .leaflet-popup-pane { z-index: 700; }
        
        /* أزرار التحكم العائمة في الخريطة */
        .map-floating-controls {
            position: absolute;
            bottom: 24px;
            left: 14px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .map-ctrl-btn {
            width: 44px;
            height: 44px;
            background: #0F172A;
            color: #FFFFFF;
            border: 1.5px solid #00E5FF;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
            user-select: none;
            -webkit-user-select: none;
        }
        .map-ctrl-btn:active {
            transform: scale(0.92);
            background: #1E293B;
        }
        
        /* زر تبديل طبقات الخريطة في أعلى اليسار */
        .layer-selector-container {
            position: absolute;
            top: 68px;
            left: 14px;
            z-index: 1000;
        }
        .layer-menu-btn {
            background: #0F172A;
            color: #00E5FF;
            border: 1.5px solid #00E5FF;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .layer-dropdown {
            display: none;
            position: absolute;
            top: 42px;
            left: 0;
            background: #0F172A;
            border: 1.5px solid #00E5FF;
            border-radius: 12px;
            padding: 6px;
            min-width: 170px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            flex-direction: column;
            gap: 4px;
        }
        .layer-dropdown.show { display: flex; }
        .layer-option {
            background: transparent;
            color: #FFFFFF;
            border: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 11.5px;
            font-weight: 600;
            text-align: right;
            cursor: pointer;
            transition: background 0.15s;
        }
        .layer-option:active, .layer-option.active {
            background: rgba(0, 229, 255, 0.2);
            color: #00E5FF;
        }
        
        /* بطاقة النافذة المنبثقة عند النقر على الدبوس */
        .leaflet-popup-content-wrapper { 
            background: #0F172A !important; 
            color: #FFFFFF !important; 
            border: 2px solid #00E5FF; 
            border-radius: 16px; 
            padding: 4px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.85); 
        }
        .leaflet-popup-tip { background: #0F172A !important; }
        
        .popup-card { 
            font-family: system-ui, -apple-system, sans-serif; 
            text-align: right; 
            direction: rtl; 
            color: #FFFFFF; 
            padding: 8px 6px; 
            min-width: 220px; 
        }
        .popup-cat-badge { 
            display: inline-block; 
            font-size: 10.5px; 
            padding: 2px 8px; 
            border-radius: 12px; 
            background: rgba(255,255,255,0.1); 
            margin-bottom: 4px; 
            font-weight: 700; 
        }
        .popup-approx-badge { 
            display: inline-block; 
            font-size: 9.5px; 
            padding: 1px 6px; 
            border-radius: 8px; 
            background: rgba(245,158,11,0.2); 
            color: #F59E0B; 
            margin-bottom: 4px; 
        }
        .popup-title { 
            font-size: 15px; 
            font-weight: 800; 
            color: #00E5FF; 
            margin-bottom: 4px; 
            line-height: 1.3; 
        }
        .popup-spec { 
            font-size: 12px; 
            color: #CBD5E1; 
            margin-bottom: 6px; 
        }
        .popup-meta { 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
            font-size: 11px; 
            margin-bottom: 10px; 
            color: #94A3B8; 
            border-top: 1px solid rgba(255,255,255,0.1); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding: 6px 0; 
        }
        .popup-meta-row { display: flex; justify-content: space-between; }
        .popup-eta { color: #38BDF8; font-weight: bold; }
        .popup-buttons { display: flex; flex-direction: column; gap: 6px; }
        .popup-buttons-row { display: flex; gap: 6px; }
        .btn-details { 
            width: 100%; 
            background: linear-gradient(135deg, #00E5FF, #00B4D8); 
            color: #0F172A; 
            border: none; 
            padding: 9px 10px; 
            border-radius: 10px; 
            font-weight: 800; 
            font-size: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 4px; 
        }
        .btn-call { 
            flex: 1; 
            background: #10B981; 
            color: #FFFFFF; 
            border: none; 
            padding: 8px 6px; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 12px; 
            cursor: pointer; 
            text-align: center; 
            text-decoration: none; 
            display: inline-block; 
        }
        .btn-nav { 
            flex: 1; 
            background: #3B82F6; 
            color: #FFFFFF; 
            border: none; 
            padding: 8px 6px; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 12px; 
            cursor: pointer; 
            text-align: center; 
        }
        
        /* دبابيس الخدمات والعناصر */
        .custom-pin { 
            width: 44px; 
            height: 44px; 
            background: #1E293B; 
            border-width: 3px; 
            border-style: solid; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); 
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .custom-pin:active, .custom-pin:hover { transform: scale(1.22); }
        .user-marker-container { position: relative; width: 32px; height: 32px; }
        .user-marker { 
            width: 22px; 
            height: 22px; 
            background: #00E5FF; 
            border: 3px solid #FFFFFF; 
            border-radius: 50%; 
            box-shadow: 0 0 20px #00E5FF; 
            position: absolute; 
            top: 5px; left: 5px; 
        }
        .user-pulse { 
            width: 32px; 
            height: 32px; 
            background: rgba(0, 229, 255, 0.35); 
            border-radius: 50%; 
            position: absolute; 
            top: 0; left: 0; 
            animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1); 
        }
        @keyframes pulse-ring { 
            0% { transform: scale(0.6); opacity: 0.9; } 
            70% { transform: scale(1.6); opacity: 0.1; } 
            100% { transform: scale(1.8); opacity: 0; } 
        }

        /* تسميات المدن واليمن على الخريطة الأوفلاين */
        .yemen-city-label {
            background: rgba(15, 23, 42, 0.82);
            color: #FFFFFF;
            border: 1px solid rgba(0, 229, 255, 0.6);
            border-radius: 8px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <!-- زر تبديل نوع الخريطة -->
    <div class="layer-selector-container">
        <button class="layer-menu-btn" onclick="toggleLayerMenu(event)">
            <span>🗺️ نوع الخريطة</span>
        </button>
        <div id="layerDropdown" class="layer-dropdown">
            <button class="layer-option active" onclick="switchLayer('googleRoads', this)">🗺️ شوارع (Google)</button>
            <button class="layer-option" onclick="switchLayer('googleSatellite', this)">🛰️ قمر صناعي (Satellite)</button>
            <button class="layer-option" onclick="switchLayer('esri', this)">🌍 خريطة إيزري (Esri)</button>
            <button class="layer-option" onclick="switchLayer('carto', this)">🏙️ خريطة كارتو (CartoDB)</button>
            <button class="layer-option" onclick="switchLayer('osm', this)">🌐 خريطة الشوارع (OSM)</button>
        </div>
    </div>

    <!-- أزرار التكبير والتصغير والموقع العائمة -->
    <div class="map-floating-controls">
        <button class="map-ctrl-btn" title="تكبير" onclick="if(map) map.zoomIn();">＋</button>
        <button class="map-ctrl-btn" title="تصغير" onclick="if(map) map.zoomOut();">－</button>
        <button class="map-ctrl-btn" title="موقعي الحالي" onclick="recenterOnUser();">📍</button>
        <button class="map-ctrl-btn" title="المدينة المختارة" onclick="recenterOnCity();">🏙️</button>
    </div>

    <script>
        // Safe default coordinates
        var userLat = 15.3694;
        var userLng = 44.1910;
        var cityLat = 15.3694;
        var cityLng = 44.1910;
        var cityZoom = 13;

        function loadBridgeCoords() {
            try {
                if (window.AndroidBridge) {
                    if (typeof window.AndroidBridge.getUserLat === 'function') {
                        var parsedLat = parseFloat(window.AndroidBridge.getUserLat());
                        if (!isNaN(parsedLat) && parsedLat !== 0) userLat = parsedLat;
                    }
                    if (typeof window.AndroidBridge.getUserLng === 'function') {
                        var parsedLng = parseFloat(window.AndroidBridge.getUserLng());
                        if (!isNaN(parsedLng) && parsedLng !== 0) userLng = parsedLng;
                    }
                }
            } catch(e) {
                console.error("Coordinate retrieval exception: " + e);
            }
        }

        var map = null;
        var clusterGroup = null;
        var userMarker = null;
        var currentTileLayer = null;
        var availableLayers = {};

        function toggleLayerMenu(e) {
            e.stopPropagation();
            var dropdown = document.getElementById('layerDropdown');
            if (dropdown) dropdown.classList.toggle('show');
        }

        document.addEventListener('click', function() {
            var dropdown = document.getElementById('layerDropdown');
            if (dropdown) dropdown.classList.remove('show');
        });

        function switchLayer(layerKey, btnElem) {
            if (!map || !availableLayers[layerKey]) return;
            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            currentTileLayer = availableLayers[layerKey];
            currentTileLayer.addTo(map);

            var options = document.querySelectorAll('.layer-option');
            options.forEach(function(opt) { opt.classList.remove('active'); });
            if (btnElem) btnElem.classList.add('active');

            var dropdown = document.getElementById('layerDropdown');
            if (dropdown) dropdown.classList.remove('show');
        }

        function recenterOnUser() {
            if (map && !isNaN(userLat) && !isNaN(userLng)) {
                map.flyTo([userLat, userLng], 15, { animate: true, duration: 0.8 });
            }
        }

        function recenterOnCity() {
            if (map && !isNaN(cityLat) && !isNaN(cityLng)) {
                map.flyTo([cityLat, cityLng], cityZoom || 13, { animate: true, duration: 0.8 });
            }
        }

        function calculateDistKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2-lat1) * Math.PI / 180;
            var dLon = (lon2-lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function computeEtaText(distKm) {
            if (distKm < 1.0) {
                var mins = Math.max(1, Math.round(distKm / 5.0 * 60));
                return '⏱️ ~ ' + mins + ' دقيقة سيراً (' + Math.round(distKm * 1000) + ' م)';
            } else {
                var mins = Math.max(1, Math.round(distKm / 35.0 * 60));
                return '🚘 ~ ' + mins + ' دقيقة بالسيارة (' + distKm.toFixed(1) + ' كم)';
            }
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        // رسم خريطة اليمن الأساسية المتجهية (Offline Yemen Vector Map)
        // تضمن ظهور خريطة اليمن ومعالمها ومدنها وشوارعها فوراً حتى بدون أي اتصال إنترنت!
        function drawYemenBaseVectorMap() {
            if (!map) return;

            // حدود وخارطة الجمهورية اليمنية الجغرافية الدقيقة
            var yemenBorders = [
                // مضيق باب المندب والساحل الغربي للبحر الأحمر
                [12.60, 43.48], [12.75, 43.40], [13.15, 43.25], [13.35, 43.15],
                [13.75, 43.05], [14.05, 42.98], [14.35, 42.95], [14.80, 42.94], // الحديدة
                [15.30, 42.85], [15.80, 42.75], [16.30, 42.78], [16.42, 42.82], // ميدي
                // الحدود الشمالية (صعدة، الجوف، الربع الخالي)
                [16.85, 43.15], [17.30, 43.45], [17.50, 44.10], [17.40, 44.60],
                [17.20, 45.40], [17.00, 46.50], [17.25, 47.50], [17.50, 49.00],
                [18.00, 50.50], [18.50, 52.00], [19.00, 52.50],
                // الحدود الشرقية مع عمان
                [17.30, 52.80], [16.65, 53.11],
                // ساحل بحر العرب وخليج عدن (المهرة، حضرموت، شبوة، أبين، عدن)
                [16.20, 52.18], // الغيضة
                [15.60, 51.50], [15.20, 50.80], [14.80, 50.00],
                [14.54, 49.12], // المكلا
                [14.20, 48.50], [14.00, 47.80], [13.80, 47.00], // بلحاف
                [13.40, 46.00], [13.13, 45.38], // زنجبار - أبين
                [12.78, 45.02], // عدن
                [12.70, 44.50], [12.60, 44.00], [12.60, 43.48]  // باب المندب
            ];

            // مضلع الجمهورية اليمنية
            L.polygon(yemenBorders, {
                color: '#0284C7',
                weight: 2.5,
                fillColor: '#F8FAFC',
                fillOpacity: 0.65,
                dashArray: '4, 4'
            }).addTo(map);

            // شبكة الطرق والشرايين الرئيسية في اليمن
            var yemenHighways = [
                // طريق صنعاء - ذمار - إب - تعز - لحج - عدن
                [[15.37, 44.19], [14.54, 44.41], [13.97, 44.18], [13.58, 44.02], [13.06, 44.88], [12.78, 45.02]],
                // طريق صنعاء - مناخة - باجل - الحديدة
                [[15.37, 44.19], [15.07, 43.74], [14.98, 43.28], [14.80, 42.95]],
                // طريق صنعاء - مأرب - العبر - حضرموت
                [[15.37, 44.19], [15.46, 45.33], [16.12, 47.24], [15.94, 48.79], [14.54, 49.12]],
                // طريق عدن - أبين - شبوة - المكلا
                [[12.78, 45.02], [13.13, 45.38], [14.00, 47.80], [14.54, 49.12]],
                // طريق تعز - المخا - الحديدة
                [[13.58, 44.02], [13.32, 43.25], [14.80, 42.95]]
            ];

            yemenHighways.forEach(function(hw) {
                L.polyline(hw, {
                    color: '#F59E0B',
                    weight: 2,
                    opacity: 0.5,
                    dashArray: '3, 6'
                }).addTo(map);
            });

            // قائمة مدن ومحافظات الجمهورية اليمنية بمعالم دقيقة
            var yemenCities = [
                { name: '🇾🇪 صنعاء (العاصمة)', lat: 15.3694, lng: 44.1910 },
                { name: '🌊 عدن', lat: 12.7855, lng: 45.0186 },
                { name: '🏰 تعز', lat: 13.5789, lng: 44.0195 },
                { name: '🌿 إب', lat: 13.9667, lng: 44.1833 },
                { name: '⚓ الحديدة', lat: 14.7978, lng: 42.9545 },
                { name: '🌴 المكلا', lat: 14.5425, lng: 49.1242 },
                { name: '🏛️ ذمار', lat: 14.5427, lng: 44.4051 },
                { name: '🏜️ مأرب', lat: 15.4628, lng: 45.3258 },
                { name: '🕌 سيئون', lat: 15.9432, lng: 48.7871 },
                { name: '⛰️ عتق (شبوة)', lat: 14.5377, lng: 46.8319 },
                { name: '🛡️ صعدة', lat: 16.9402, lng: 43.7639 },
                { name: '🏔️ حجة', lat: 15.6917, lng: 43.6028 },
                { name: '🏖️ الغيضة (المهرة)', lat: 16.2079, lng: 52.1760 },
                { name: '🏝️ سقطرى', lat: 12.4634, lng: 53.8237 }
            ];

            yemenCities.forEach(function(city) {
                var labelIcon = L.divIcon({
                    className: 'yemen-city-label',
                    html: city.name,
                    iconSize: null,
                    iconAnchor: [35, 12]
                });
                L.marker([city.lat, city.lng], { icon: labelIcon, interactive: false, zIndexOffset: 200 }).addTo(map);
            });
        }

        function initMapEngine() {
            if (typeof L === 'undefined') {
                console.error("Leaflet library is missing.");
                return;
            }

            try {
                loadBridgeCoords();
                if (isNaN(userLat) || userLat === 0) userLat = 15.3694;
                if (isNaN(userLng) || userLng === 0) userLng = 44.1910;

                cityLat = userLat;
                cityLng = userLng;

                map = L.map('map', { 
                    zoomControl: false, 
                    attributionControl: false,
                    fadeAnimation: true,
                    zoomAnimation: true,
                    minZoom: 5,
                    maxZoom: 20
                }).setView([userLat, userLng], 13);

                // رسم الخريطة المتجهية الأساسية لليمن أولاً (تضمن عدم وجود شاشة سوداء إطلاقاً)
                drawYemenBaseVectorMap();

                // مزودات الخرائط المجانية ذات الأداء العالي غير المحظورة في اليمن:
                // 1. Google Maps Streets (شوارع باللغة العربية مع كافة المعالم)
                var googleRoadsLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=ar', {
                    maxZoom: 20,
                    minZoom: 5,
                    subdomains: ['0', '1', '2', '3']
                });

                // 2. Google Maps Hybrid Satellite (قمر صناعي عالي الدقة مع أسماء الشوارع بالعربية)
                var googleSatelliteLayer = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}&hl=ar', {
                    maxZoom: 20,
                    minZoom: 5,
                    subdomains: ['0', '1', '2', '3']
                });

                // 3. Esri World Street Map (مجانية 100%، سريعة ومفتوحة عالمياً)
                var esriLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19,
                    minZoom: 5
                });

                // 4. CartoDB Voyager
                var cartoLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    minZoom: 5,
                    subdomains: ['a', 'b', 'c', 'd']
                });

                // 5. OpenStreetMap
                var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    minZoom: 5,
                    subdomains: ['a', 'b', 'c']
                });

                availableLayers = {
                    'googleRoads': googleRoadsLayer,
                    'googleSatellite': googleSatelliteLayer,
                    'esri': esriLayer,
                    'carto': cartoLayer,
                    'osm': osmLayer
                };

                // تفعيل خريطة شوارع جوجل افتراضياً
                currentTileLayer = googleRoadsLayer;
                googleRoadsLayer.addTo(map);

                // انتقال تلقائي سلس في حال تعذر طبقة معينة
                googleRoadsLayer.on('tileerror', function() {
                    if (map && map.hasLayer(googleRoadsLayer)) {
                        map.removeLayer(googleRoadsLayer);
                        currentTileLayer = esriLayer;
                        esriLayer.addTo(map);
                    }
                });

                esriLayer.on('tileerror', function() {
                    if (map && map.hasLayer(esriLayer)) {
                        map.removeLayer(esriLayer);
                        currentTileLayer = cartoLayer;
                        cartoLayer.addTo(map);
                    }
                });

                // موقع المستخدم المباشر
                var userIcon = L.divIcon({
                    className: 'user-marker-container',
                    html: '<div class="user-pulse"></div><div class="user-marker"></div>',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });
                userMarker = L.marker([userLat, userLng], { icon: userIcon, zIndexOffset: 1000 }).addTo(map)
                    .bindPopup("<div class='popup-card'><b style='color:#00E5FF;'>📍 موقعك الحالي المباشر</b><br/><span style='font-size:11px;color:#94A3B8;'>نقطة ارتكاز البحث وحساب المسافات</span></div>");

                // مجموعة تجميع النقاط الذكية
                clusterGroup = (typeof L.markerClusterGroup === 'function') ? L.markerClusterGroup({
                    chunkedLoading: true,
                    maxClusterRadius: 35,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false
                }) : L.layerGroup();

                map.addLayer(clusterGroup);

                // تحديث علامات ومقدمي الخدمات
                window.updateMapMarkers = function(rawMarkers) {
                    if (!map || !clusterGroup) return;
                    if (!Array.isArray(rawMarkers)) return;
                    
                    clusterGroup.clearLayers();

                    rawMarkers.forEach(function(item) {
                        if (!item || item.lat === undefined || item.lng === undefined) return;
                        var distNum = calculateDistKm(userLat, userLng, item.lat, item.lng);
                        var etaString = computeEtaText(distNum);

                        var customIcon = L.divIcon({
                            className: 'custom-pin-wrapper',
                            html: '<div class="custom-pin" style="border-color:' + (item.badgeColor || '#00E5FF') + '; box-shadow: 0 0 12px ' + (item.badgeColor || '#00E5FF') + '66;">' + (item.emoji || '📍') + '</div>',
                            iconSize: [44, 44],
                            iconAnchor: [22, 22]
                        });

                        var m = L.marker([item.lat, item.lng], { icon: customIcon });

                        var approxBadge = item.isApprox ? '<div class="popup-approx-badge">📍 موقع تقريبي</div>' : '';
                        var callBtnHtml = item.phone ? '<a href="tel:' + item.phone + '" class="btn-call">📞 اتصال</a>' : '';
                        var navBtnHtml = '<button onclick="if(window.AndroidBridge && window.AndroidBridge.openNavigation) AndroidBridge.openNavigation(' + item.lat + ',' + item.lng + ',\'' + (item.name || '').replace(/'/g, "\\'") + '\')" class="btn-nav">🗺️ اتجاهات</button>';

                        var popupHtml = "<div class='popup-card'>" +
                            "<div class='popup-cat-badge' style='color:" + (item.badgeColor || '#00E5FF') + "; border: 1px solid " + (item.badgeColor || '#00E5FF') + "44;'>" + escapeHtml(item.serviceCategory) + "</div>" +
                            approxBadge +
                            "<div class='popup-title'>" + escapeHtml(item.name) + "</div>" +
                            "<div class='popup-spec'>" + escapeHtml(item.spec) + "</div>" +
                            "<div class='popup-meta'>" +
                                "<div class='popup-meta-row'><span>⭐ تقييم: " + escapeHtml(item.rating || '5.0') + "</span><span>" + escapeHtml(item.status) + "</span></div>" +
                                "<div class='popup-eta'>" + etaString + "</div>" +
                            "</div>" +
                            "<div class='popup-buttons'>" +
                                "<button onclick=\"if(window.AndroidBridge && window.AndroidBridge.onMarkerClicked) AndroidBridge.onMarkerClicked('" + item.type + "', '" + item.id + "')\" class='btn-details'>عرض التفاصيل والطلب 🔍</button>" +
                                "<div class='popup-buttons-row'>" +
                                    callBtnHtml +
                                    navBtnHtml +
                                    "</div>" +
                            "</div>" +
                            "</div>";

                        m.bindPopup(popupHtml);
                        clusterGroup.addLayer(m);
                    });

                    console.log("Leaflet markers loaded successfully: " + rawMarkers.length);
                };

                // تحديث مركز الخريطة والتكبير
                window.updateMapCenter = function(lat, lng, zoom) {
                    if (map && !isNaN(lat) && !isNaN(lng)) {
                        cityLat = lat;
                        cityLng = lng;
                        cityZoom = (zoom && !isNaN(zoom)) ? zoom : 13;
                        map.flyTo([lat, lng], cityZoom, { animate: true, duration: 0.8 });
                    }
                };

                // جلب الدبابيس الأولية
                var initialMarkers = [];
                try {
                    if (window.AndroidBridge && typeof window.AndroidBridge.getMarkersJson === 'function') {
                        var mJson = window.AndroidBridge.getMarkersJson();
                        if (mJson && mJson.length > 2) {
                            initialMarkers = JSON.parse(mJson);
                        }
                    }
                } catch(e) {
                    console.error("Markers initial load error: " + e);
                }
                if (initialMarkers && Array.isArray(initialMarkers) && initialMarkers.length > 0) {
                    window.updateMapMarkers(initialMarkers);
                }

                // إعلام التطبيق بجاهزية الخريطة
                if (window.AndroidBridge && typeof window.AndroidBridge.onMapReady === 'function') {
                    try {
                        window.AndroidBridge.onMapReady();
                    } catch(e) {
                        console.error("onMapReady bridge notice: " + e);
                    }
                }

                setTimeout(function() {
                    if (map) map.invalidateSize();
                }, 300);

            } catch(e) {
                console.error("Map initialization exception: " + e.message);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMapEngine);
        } else {
            initMapEngine();
        }
    </script>
</body>
</html>
