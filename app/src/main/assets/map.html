<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>خريطة Vela العالمية المفتوحة</title>
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="MarkerCluster.css" />
    <link rel="stylesheet" href="MarkerCluster.Default.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0B1120;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", Tahoma, sans-serif;
            overflow: hidden;
        }
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #0B1120;
            transition: transform 0.3s ease;
        }

        /* Marker Badge Design */
        .custom-leaflet-marker {
            background: transparent !important;
            border: none !important;
            overflow: visible !important;
        }
        .custom-pin-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
            user-select: none;
            -webkit-user-select: none;
            width: 145px;
        }
        .custom-pin-head {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            color: #ffffff;
            border: 2.5px solid #ffffff;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-pin-head:hover,
        .custom-pin-head:active {
            transform: scale(1.18);
        }
        .custom-pin-label {
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 2.5px 8px;
            border-radius: 12px;
            margin-top: 3px;
            white-space: nowrap;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            border: 1px solid rgba(0, 229, 255, 0.55);
            text-align: center;
            pointer-events: none;
        }

        /* User GPS Location Marker */
        .user-pulse-marker {
            position: relative;
            width: 24px;
            height: 24px;
        }
        .user-dot {
            width: 16px;
            height: 16px;
            background: #00E5FF;
            border: 3px solid #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
            box-shadow: 0 0 14px #00E5FF;
            z-index: 2;
        }
        .user-pulse {
            width: 40px;
            height: 40px;
            background: rgba(0, 229, 255, 0.35);
            border-radius: 50%;
            position: absolute;
            top: -8px;
            left: -8px;
            animation: userPulsing 2s infinite ease-out;
            z-index: 1;
        }
        @keyframes userPulsing {
            0% { transform: scale(0.4); opacity: 0.95; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        .mode-indicator {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.90);
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #00E5FF;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .leaflet-control-zoom {
            display: none !important;
        }
        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.65) !important;
            color: #64748B !important;
            font-size: 7.5px !important;
            padding: 1px 6px !important;
            border-radius: 6px 0 0 0;
            line-height: 10px !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            pointer-events: none !important;
        }
        .leaflet-control-attribution a,
        .leaflet-control-attribution span {
            color: #64748B !important;
            text-decoration: none !important;
            pointer-events: none !important;
            cursor: default !important;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map"></div>
        <div id="modeIndicator" class="mode-indicator">
            <span id="modeIcon">🛰️</span>
            <span id="modeTitle">الأقمار الاصطناعية (OAM)</span>
        </div>
    </div>

    <script src="leaflet.js"></script>
    <script src="leaflet.markercluster.js"></script>
    <script>
        var map;
        var currentBaseLayer;
        var markerClusterGroup;
        var userMarker = null;
        var userAccuracyCircle = null;
        var userLat = 15.3694;
        var userLng = 44.1910;
        var activeMode = 'SATELLITE';

        var providers = {
            'osm': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 24, maxNativeZoom: 19, subdomains: ['a', 'b', 'c'], attribution: 'OSM'
            }),
            'hot': L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
                maxZoom: 24, maxNativeZoom: 19, subdomains: ['a', 'b', 'c'], attribution: 'HOT'
            }),
            'topo': L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                maxZoom: 24, maxNativeZoom: 17, subdomains: ['a', 'b', 'c'], attribution: 'Topo'
            }),
            'satellite': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 24, maxNativeZoom: 19, attribution: 'Esri'
            })
        };

        function initMap(lat, lng, mode) {
            userLat = lat || 15.3694;
            userLng = lng || 44.1910;
            activeMode = mode || 'SATELLITE';

            try {
                map = L.map('map', {
                    zoomControl: false,
                    attributionControl: true,
                    fadeAnimation: true,
                    zoomAnimation: true
                }).setView([userLat, userLng], 15);

                setLayer(activeMode);

                markerClusterGroup = L.markerClusterGroup({
                    maxClusterRadius: 40,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false
                });
                map.addLayer(markerClusterGroup);

                updateUserLocation(userLat, userLng, 50, false);

                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            } catch (e) {
                console.error("Map init error:", e);
            }
        }

        function setLayer(mode) {
            activeMode = mode || 'SATELLITE';
            if (currentBaseLayer && map) {
                map.removeLayer(currentBaseLayer);
            }

            var providerKey = 'satellite';
            var title = 'أقمار صناعية (عالي الدقة)';
            var icon = '🛰️';

            if (mode === 'OSM') {
                providerKey = 'osm';
                title = 'خريطة الشوارع القياسية (OSM)';
                icon = '🌐';
            } else if (mode === 'HOT') {
                providerKey = 'hot';
                title = 'خريطة الشوارع الحية (HOT)';
                icon = '🗺️';
            } else if (mode === 'TOPO') {
                providerKey = 'topo';
                title = 'التضاريس والارتفاعات (Topo)';
                icon = '⛰️';
            } else if (mode === 'VELA_3D') {
                providerKey = 'satellite';
                title = 'Vela 3D (مباني ثلاثية الأبعاد)';
                icon = '🏙️';
            } else if (mode === 'SATELLITE') {
                providerKey = 'satellite';
                title = 'أقمار صناعية (عالي الدقة)';
                icon = '🛰️';
            }

            if (providers[providerKey] && map) {
                currentBaseLayer = providers[providerKey];
                currentBaseLayer.addTo(map);
            }

            var iconEl = document.getElementById('modeIcon');
            var titleEl = document.getElementById('modeTitle');
            if (iconEl) iconEl.innerText = icon;
            if (titleEl) titleEl.innerText = title;
        }

        function switchMapMode(mode) {
            setLayer(mode);
        }

        function updateUserLocation(lat, lng, accuracy, pan) {
            userLat = lat;
            userLng = lng;
            if (!map) return;
            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
                if (userAccuracyCircle) userAccuracyCircle.setLatLng([lat, lng]);
                if (pan) map.setView([lat, lng], map.getZoom());
            } else {
                var pulseHtml = '<div class="user-pulse-marker"><div class="user-pulse"></div><div class="user-dot"></div></div>';
                var icon = L.divIcon({
                    className: 'custom-leaflet-marker',
                    html: pulseHtml,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });
                userMarker = L.marker([lat, lng], {icon: icon}).addTo(map);
                userAccuracyCircle = L.circle([lat, lng], {
                    radius: accuracy || 50,
                    color: '#00E5FF',
                    fillColor: '#00E5FF',
                    fillOpacity: 0.15,
                    weight: 1
                }).addTo(map);
                if (pan) map.setView([lat, lng], 15);
            }
        }

        function setMarkersBase64(b64) {
            try {
                var jsonStr = decodeURIComponent(escape(window.atob(b64)));
                var markers = JSON.parse(jsonStr);
                setMarkersList(markers);
            } catch (e) {
                console.error("setMarkersBase64 error:", e);
            }
        }

        function setMarkers(jsonStr) {
            try {
                var markers = JSON.parse(jsonStr);
                setMarkersList(markers);
            } catch (e) {
                console.error("setMarkers error:", e);
            }
        }

        function setMarkersList(markers) {
            if (!markerClusterGroup) return;
            markerClusterGroup.clearLayers();
            markers.forEach(function(m) {
                var emoji = '📍';
                var color = '#2563EB';
                if (m.category === 'store') { emoji = '🏪'; color = '#10B981'; }
                else if (m.category === 'provider') { emoji = '👷'; color = '#3B82F6'; }
                else if (m.category === 'property') { emoji = '🏢'; color = '#F59E0B'; }

                var html = '<div class="custom-pin-container" onclick="onMarkerClick(\'' + m.id + '\', \'' + m.category + '\')">' +
                           '<div class="custom-pin-head" style="background-color: ' + color + ';">' + emoji + '</div>' +
                           '<div class="custom-pin-label">' + m.title + '</div>' +
                           '</div>';

                var icon = L.divIcon({
                    className: 'custom-leaflet-marker',
                    html: html,
                    iconSize: [145, 65],
                    iconAnchor: [72, 38]
                });

                var marker = L.marker([m.lat, m.lng], {icon: icon});
                marker.entityId = m.id;
                marker.category = m.category;
                markerClusterGroup.addLayer(marker);
            });
        }

        function setCity(name, lat, lng, zoom) {
            if (map) {
                map.setView([lat, lng], zoom || 14);
            }
        }

        function setMapPerspective(tilt, rotation) {
            // No CSS tilt skewing to prevent trapezoid distortion
        }

        function zoomIn() {
            if (map) map.zoomIn();
        }

        function zoomOut() {
            if (map) map.zoomOut();
        }

        function recenterUser() {
            if (map && userLat && userLng) {
                map.setView([userLat, userLng], 15);
            }
        }

        function onMarkerClick(id, category) {
            if (window.AndroidBridge && window.AndroidBridge.onMarkerSelected) {
                window.AndroidBridge.onMarkerSelected(id, category);
            }
        }

        // Auto initialize on load if not called by Android view
        window.onload = function() {
            if (!map) {
                initMap(15.3694, 44.1910, 'SATELLITE');
            }
        };
    </script>
</body>
</html>
