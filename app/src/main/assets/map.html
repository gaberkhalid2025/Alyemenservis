<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>دليل خدمات اليمن - الخريطة المباشرة</title>
    
    <!-- Primary CDN Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" crossorigin="" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" crossorigin="" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            width: 100%;
            background: #0F172A;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            position: relative;
        }
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0F172A;
            background-image: radial-gradient(rgba(0, 229, 255, 0.08) 1px, transparent 0);
            background-size: 24px 24px;
        }
        /* Fallback inline styles for Leaflet elements if CSS fails to load */
        .leaflet-container { width: 100%; height: 100%; background: #0F172A !important; font-family: inherit; }
        .leaflet-pane { z-index: 400; }
        .leaflet-tile-pane { z-index: 200; }
        .leaflet-marker-pane { z-index: 600; }
        .leaflet-popup-pane { z-index: 700; }
        .leaflet-tile-container img { filter: brightness(0.92) contrast(1.08); }
        .leaflet-popup-content-wrapper { background: #1E293B !important; color: #FFFFFF !important; border: 2px solid #00E5FF; border-radius: 16px; padding: 4px; box-shadow: 0 12px 30px rgba(0,0,0,0.8); }
        .leaflet-popup-tip { background: #1E293B !important; }
        
        .popup-card { font-family: system-ui, -apple-system, sans-serif; text-align: right; direction: rtl; color: #FFFFFF; padding: 8px 6px; min-width: 220px; }
        .popup-cat-badge { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 12px; background: rgba(255,255,255,0.1); margin-bottom: 4px; font-weight: 700; }
        .popup-approx-badge { display: inline-block; font-size: 9.5px; padding: 1px 6px; border-radius: 8px; background: rgba(245,158,11,0.2); color: #F59E0B; margin-bottom: 4px; }
        .popup-title { font-size: 15px; font-weight: 800; color: #00E5FF; margin-bottom: 4px; line-height: 1.3; }
        .popup-spec { font-size: 12px; color: #CBD5E1; margin-bottom: 6px; }
        .popup-meta { display: flex; flex-direction: column; gap: 3px; font-size: 11px; margin-bottom: 10px; color: #94A3B8; border-top: 1px solid rgba(255,255,255,0.1); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 6px 0; }
        .popup-meta-row { display: flex; justify-content: space-between; }
        .popup-eta { color: #38BDF8; font-weight: bold; }
        .popup-buttons { display: flex; flex-direction: column; gap: 6px; }
        .popup-buttons-row { display: flex; gap: 6px; }
        .btn-details { width: 100%; background: linear-gradient(135deg, #00E5FF, #00B4D8); color: #0F172A; border: none; padding: 9px 10px; border-radius: 10px; font-weight: 800; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-call { flex: 1; background: #10B981; color: #FFFFFF; border: none; padding: 8px 6px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
        .btn-nav { flex: 1; background: #3B82F6; color: #FFFFFF; border: none; padding: 8px 6px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; text-align: center; }
        
        .custom-pin { width: 44px; height: 44px; background: #1E293B; border-width: 3px; border-style: solid; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .custom-pin:active, .custom-pin:hover { transform: scale(1.22); }
        .user-marker-container { position: relative; width: 32px; height: 32px; }
        .user-marker { width: 22px; height: 22px; background: #00E5FF; border: 3px solid #FFFFFF; border-radius: 50%; box-shadow: 0 0 20px #00E5FF; position: absolute; top: 5px; left: 5px; z-index: 2; }
        .user-pulse { position: absolute; width: 46px; height: 46px; background: rgba(0, 229, 255, 0.4); border-radius: 50%; top: -7px; left: -7px; animation: pulseRing 2s infinite ease-out; }
        @keyframes pulseRing { 0% { transform: scale(0.4); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
        
        .marker-cluster-small { background-color: rgba(0, 229, 255, 0.4); }
        .marker-cluster-small div { background-color: #00E5FF; color: #0F172A; font-weight: 800; }
        .marker-cluster-medium { background-color: rgba(245, 158, 11, 0.4); }
        .marker-cluster-medium div { background-color: #F59E0B; color: #0F172A; font-weight: 800; }
        .marker-cluster-large { background-color: rgba(236, 72, 153, 0.4); }
        .marker-cluster-large div { background-color: #EC4899; color: #FFFFFF; font-weight: 800; }

        /* Fallback HTML Overlay when map fails */
        #map-fallback-overlay {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: #1E293B;
            border: 2px solid #00E5FF;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: #FFFFFF;
            width: 88%;
            max-width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        #map-fallback-overlay h3 { color: #00E5FF; font-size: 15px; margin-bottom: 8px; }
        #map-fallback-overlay p { color: #94A3B8; font-size: 12px; margin-bottom: 16px; line-height: 1.5; }
        .fallback-btn-row { display: flex; gap: 8px; justify-content: center; }
        .fallback-btn { background: #00E5FF; color: #0F172A; border: none; padding: 9px 14px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; flex: 1; }
        .fallback-btn-sec { background: rgba(255,255,255,0.1); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.2); padding: 9px 14px; border-radius: 10px; font-weight: bold; font-size: 12px; cursor: pointer; flex: 1; }
    </style>
    
    <!-- Primary CDN Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin=""></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js" crossorigin=""></script>
</head>
<body>
    <div id="map"></div>
    
    <div id="map-fallback-overlay">
        <h3>📡 تعذر اتصال الخريطة بالشبكة</h3>
        <p>قد تكون التغطية ضعيفة. يمكنك استخدام رادار الخدمات التفاعلي لعرض المنشآت القريبة بدون إنترنت.</p>
        <div class="fallback-btn-row">
            <button class="fallback-btn" onclick="if(window.AndroidBridge && window.AndroidBridge.switchToRadar) AndroidBridge.switchToRadar();">الانتقال للرادار 📡</button>
            <button class="fallback-btn-sec" onclick="location.reload();">إعادة المحاولة 🔄</button>
        </div>
    </div>

    <script>
        var userLat = _USER_LAT_;
        var userLng = _USER_LNG_;
        var map = null;
        var clusterGroup = null;

        function showFallbackUI(reason) {
            console.error("Map initialization failed: " + reason);
            var overlay = document.getElementById("map-fallback-overlay");
            if (overlay) overlay.style.display = "block";
            if (window.AndroidBridge && window.AndroidBridge.onMapLoadFailed) {
                window.AndroidBridge.onMapLoadFailed();
            }
        }

        function calculateDistKm(lat1, lon1, lat2, lon2) {
            var R = 6371;
            var dLat = (lat2-lat1) * Math.PI / 180;
            var dLon = (lon2-lon1) * Math.PI / 180;
            var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function computeEtaText(distKm) {
            if (distKm < 1.0) {
                var mins = Math.max(1, Math.round(distKm / 5.0 * 60));
                return '⏱️ ~ ' + mins + ' دقيقة سيراً (' + Math.round(distKm * 1000) + ' م)';
            } else {
                var mins = Math.max(1, Math.round(distKm / 35.0 * 60));
                return '🚘 ~ ' + mins + ' دقيقة بالسيارة (' + distKm.toFixed(1) + ' كم)';
            }
        }

        function initMapEngine() {
            if (typeof L === 'undefined') {
                showFallbackUI("Leaflet script failed to load");
                return;
            }

            try {
                // Ensure valid coordinates
                if (!userLat || userLat === 0) userLat = 15.3694;
                if (!userLng || userLng === 0) userLng = 44.1910;

                map = L.map('map', { zoomControl: false, attributionControl: false }).setView([userLat, userLng], 14);

                // Multiple tile servers failover
                var tileUrls = [
                    'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'
                ];
                var currentTileIdx = 0;

                function loadTileServer(idx) {
                    if (idx >= tileUrls.length) return;
                    var tileLayer = L.tileLayer(tileUrls[idx], {
                        maxZoom: 19,
                        subdomains: 'abcd'
                    });
                    tileLayer.on('tileerror', function() {
                        console.warn("Tile server failed: " + tileUrls[idx]);
                        if (currentTileIdx === idx && idx + 1 < tileUrls.length) {
                            currentTileIdx++;
                            map.removeLayer(tileLayer);
                            loadTileServer(currentTileIdx);
                        }
                    });
                    tileLayer.addTo(map);
                }

                loadTileServer(0);

                var userIcon = L.divIcon({
                    className: 'user-marker-container',
                    html: '<div class="user-pulse"></div><div class="user-marker"></div>',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });
                L.marker([userLat, userLng], {icon: userIcon, zIndexOffset: 1000}).addTo(map)
                    .bindPopup("<div class='popup-card'><b style='color:#00E5FF;'>📍 موقعك الحالي المباشر</b><br/><span style='font-size:11px;color:#94A3B8;'>نقطة ارتكاز البحث وحساب المسافات</span></div>");

                clusterGroup = (typeof L.markerClusterGroup === 'function') ? L.markerClusterGroup({
                    chunkedLoading: true,
                    maxClusterRadius: 40,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false
                }) : L.layerGroup();

                window.updateMapMarkers = function(rawMarkers) {
                    if (!map) return;
                    if (!Array.isArray(rawMarkers)) return;
                    clusterGroup.clearLayers();

                    rawMarkers.forEach(function(item) {
                        if (!item || item.lat === undefined || item.lng === undefined) return;
                        var distNum = calculateDistKm(userLat, userLng, item.lat, item.lng);
                        var etaString = computeEtaText(distNum);

                        var customIcon = L.divIcon({
                            className: 'custom-pin-wrapper',
                            html: '<div class="custom-pin" style="border-color:' + (item.badgeColor || '#00E5FF') + '; box-shadow: 0 0 12px ' + (item.badgeColor || '#00E5FF') + '66;">' + (item.emoji || '📍') + '</div>',
                            iconSize: [44, 44],
                            iconAnchor: [22, 22]
                        });

                        var m = L.marker([item.lat, item.lng], {icon: customIcon});

                        var approxBadge = item.isApprox ? '<div class="popup-approx-badge">📍 موقع تقريبي</div>' : '';
                        var callBtnHtml = item.phone ? '<a href="tel:' + item.phone + '" class="btn-call">📞 اتصال</a>' : '';
                        var navBtnHtml = '<button onclick="if(window.AndroidBridge && window.AndroidBridge.openNavigation) AndroidBridge.openNavigation(' + item.lat + ',' + item.lng + ',\'' + (item.name || '').replace(/'/g, "\\'") + '\')" class="btn-nav">🗺️ اتجاهات</button>';

                        var popupHtml = "<div class='popup-card'>" +
                            "<div class='popup-cat-badge' style='color:" + (item.badgeColor || '#00E5FF') + "; border: 1px solid " + (item.badgeColor || '#00E5FF') + "44;'>" + (item.serviceCategory || '') + "</div>" +
                            approxBadge +
                            "<div class='popup-title'>" + (item.name || '') + "</div>" +
                            "<div class='popup-spec'>" + (item.spec || '') + "</div>" +
                            "<div class='popup-meta'>" +
                                "<div class='popup-meta-row'><span>⭐ تقييم: " + (item.rating || '5.0') + "</span><span>" + (item.status || '') + "</span></div>" +
                                "<div class='popup-eta'>" + etaString + "</div>" +
                            "</div>" +
                            "<div class='popup-buttons'>" +
                                "<button onclick=\"if(window.AndroidBridge && window.AndroidBridge.onMarkerClicked) AndroidBridge.onMarkerClicked('" + item.type + "', '" + item.id + "')\" class='btn-details'>عرض التفاصيل والطلب 🔍</button>" +
                                "<div class='popup-buttons-row'>" +
                                    callBtnHtml +
                                    navBtnHtml +
                                "</div>" +
                            "</div>" +
                            "</div>";

                        m.bindPopup(popupHtml);
                        clusterGroup.addLayer(m);
                    });

                    map.addLayer(clusterGroup);
                    console.log("Leaflet map markers updated successfully: " + rawMarkers.length);
                };

                var initialMarkers = _MARKERS_JSON_;
                if (initialMarkers && Array.isArray(initialMarkers)) {
                    window.updateMapMarkers(initialMarkers);
                }

                if (window.AndroidBridge && window.AndroidBridge.onMapReady) {
                    window.AndroidBridge.onMapReady();
                }
            } catch(e) {
                showFallbackUI("Map init error: " + e.message);
            }
        }

        // Secondary CDN Fallback Loader if primary CDN failed
        if (typeof L === 'undefined') {
            console.warn("Primary Leaflet CDN failed. Attempting secondary unpkg CDN...");
            var secScript = document.createElement('script');
            secScript.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
            secScript.onload = function() {
                var secCluster = document.createElement('script');
                secCluster.src = "https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js";
                secCluster.onload = function() { initMapEngine(); };
                secCluster.onerror = function() { initMapEngine(); };
                document.head.appendChild(secCluster);
            };
            secScript.onerror = function() {
                showFallbackUI("Secondary Leaflet CDN failed");
            };
            document.head.appendChild(secScript);
        } else {
            initMapEngine();
        }
    </script>
</body>
</html>
